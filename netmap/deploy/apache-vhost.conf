# Set your hostname and certificate paths before enabling this site.
<VirtualHost *:443>
    ServerName netmap.example.org

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/netmap.example.org.pem
    SSLCertificateKeyFile /etc/ssl/private/netmap.example.org.key

    ProxyPreserveHost On
    ProxyAddHeaders Off
    ProxyPass / "unix:/run/netmap-pinger.sock|http://localhost/" retry=0 timeout=60
    ProxyPassReverse / http://localhost/

    <Location />
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader unset X-Forwarded-For
        RequestHeader unset Authorization
        Header onsuccess unset Cache-Control
        Header always set Cache-Control "no-store"

        AuthType Basic
        AuthName "Netmap Pinger"
        AuthUserFile /var/lib/netmap-pinger-auth/netmap.htpasswd
        <RequireAny>
            Require expr "%{REQUEST_URI} =~ m#^/static/pwa/(manifest\.webmanifest|icon-(192|512)\.png)$#"
            Require valid-user
        </RequireAny>
    </Location>
</VirtualHost>
